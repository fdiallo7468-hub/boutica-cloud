name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/boutica-cloud-v3-foundation]

concurrency:
  group: boutica-cloud-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: boutica_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d boutica_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/boutica_test
      BETTER_AUTH_SECRET: ci-only-secret-1234567890-abcdefghijklmnop
      BETTER_AUTH_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:3000,http://localhost:5173
      PORT: 3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply database migrations
        run: npx drizzle-kit migrate

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --runInBand

      - name: PostgreSQL integration tests
        run: NODE_OPTIONS=--experimental-vm-modules npm run test:e2e -- --runInBand

      - name: Production TypeScript build
        run: npx nest build
